name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json records and fails if it
      # disagrees with package.json, so a dependency change gets reviewed rather
      # than silently resolved differently on someone else's machine.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Catches what the other two cannot: a dynamic import that does not
      # resolve, an asset that is missing, or a Rollup-only failure.
      # axiosInstance.ts appends /api/v1 itself, so this is the bare origin.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:4000
